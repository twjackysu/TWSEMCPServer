[project]
name = "twstockmcpserver"
version = "0.1.0"
description = "A MCPServer for partial APIs of the Taiwan Stock Exchange OpenAPI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastmcp==4.1.3",
    "httpx>=0.28.1",
    "mcp[cli]>=1.9.3",
    "requests>=2.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.0",
    "pytest-rerunfailures>=14.0",
    # Pinned: a new ruff release adds rules, which must not turn CI red on unrelated PRs.
    "ruff==0.17.1",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Rules that catch bugs, not style: pyflakes (F: unused or undefined names), pycodestyle's error
# classes (E4 imports, E7 statements, E9 syntax), and bugbear (B: e.g. zip() without strict=,
# loop variables captured late, raise without from). Ruff's own default selection is wider and
# mostly typing-syntax and import-order rewrites; those are not part of this gate.
select = ["E4", "E7", "E9", "F", "B"]
